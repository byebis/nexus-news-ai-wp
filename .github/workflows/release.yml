name: Release

# Release pipeline per Nexus News AI (modello del release.yml di keeper-ai):
#   tag push (v*) o dispatch manuale
#     → qualità (php -l + sintassi JS + harness di regressione sotto tests/)
#     → build   (git archive → dist/nexus-news-ai-wp-<version>.zip; rispetta i
#                pattern export-ignore di .gitattributes: tests/, .github/)
#     → release (GitHub Release con lo zip; solo su ref tag e solo dopo build ok,
#                così una pipeline rossa non pubblica mai a metà)
#
# Nota: nexus non ha ancora un ruleset phpcs committato (né composer.json):
# il gate di qualità qui ricalca il ci.yml (php -l + JS + harness). phpcs è
# esposto come job informativo non bloccante finché non si committa un ruleset.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Quality gate (php -l + JS + harness) — blocking
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 7.4 (floor di compatibilità dichiarata)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl, mbstring, json
          coverage: none

      - name: Sintassi PHP (php -l su tutti i file del plugin)
        run: |
          set -o pipefail
          fail=0
          while IFS= read -r file; do
            if ! output=$(php -l "$file" 2>&1); then
              echo "::error file=$file::errore di sintassi PHP"
              echo "$output"
              fail=1
            fi
          done < <(git ls-files '*.php')
          if [ "$fail" -ne 0 ]; then
            echo "Sintassi PHP non valida."
            exit 1
          fi
          echo "Sintassi PHP ok su $(git ls-files '*.php' | wc -l) file."

      - name: Sintassi JS (node --check sugli asset)
        run: |
          set -o pipefail
          fail=0
          while IFS= read -r file; do
            if ! output=$(node --check "$file" 2>&1); then
              echo "::error file=$file::errore di sintassi JS"
              echo "$output"
              fail=1
            fi
          done < <(git ls-files '*.js')
          if [ "$fail" -ne 0 ]; then
            echo "Sintassi JS non valida."
            exit 1
          fi
          echo "Sintassi JS ok su $(git ls-files '*.js' | wc -l) file."

      - name: Harness di regressione (tests/)
        run: |
          php tests/guarded-get-test.php
          php tests/feed-pin-test.php

  phpcs:
    name: Coding standards (informational — nessun ruleset committato)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Installa PHP_CodeSniffer + WordPress Coding Standards
        run: |
          composer global require squizlabs/php_codesniffer wp-coding-standards/wpcs --no-interaction --no-progress

      - name: Coding standards (solo se esiste un ruleset nel repo)
        run: |
          if [ -f phpcs.xml ] || [ -f phpcs.xml.dist ]; then
            sudo "$HOME/.composer/vendor/bin/phpcs" 2>/dev/null || "$HOME/.composer/vendor/bin/phpcs"
          else
            echo "Nessun ruleset phpcs committato in nexus-news-ai-wp — check informativo saltato."
          fi

  build:
    name: Build release zip
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estrai versione dal header del plugin
        id: version
        run: |
          VERSION="$(awk '/^ \* Version:/{print $3; exit}' nexus-news-ai.php)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versione estratta: ${VERSION}"

      - name: Build zip (git archive — rispetta .gitattributes export-ignore)
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=nexus-news-ai-wp/ \
            -o "dist/nexus-news-ai-wp-${{ steps.version.outputs.version }}.zip" HEAD
          test -f "dist/nexus-news-ai-wp-${{ steps.version.outputs.version }}.zip"
          echo "Built dist/nexus-news-ai-wp-${{ steps.version.outputs.version }}.zip"

      - name: Verifica struttura zip (main file plugin in cima)
        run: |
          unzip -Z1 "dist/nexus-news-ai-wp-${{ steps.version.outputs.version }}.zip" | head -10
          echo "Files in zip: $(unzip -l "dist/nexus-news-ai-wp-${{ steps.version.outputs.version }}.zip" | tail -1 | awk '{print $2}')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-news-ai-wp-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nexus-news-ai-wp-${{ github.ref_name }}
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
