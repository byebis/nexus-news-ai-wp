name: CI

# Gate minimo del plugin: sintassi PHP su tutte le versioni dichiarate, sintassi
# JS degli asset e harness di regressione sotto tests/ (nessuna installazione
# WordPress richiesta: gli harness usano gli stub in tests/wp-stubs.php).
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 7.4 = floor di compatibilità dichiarata dal plugin; 8.1/8.3 = versioni
        # correnti (le nuove sintassi vengono intercettate dal job sul floor).
        php-version: [ '7.4', '8.1', '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, mbstring, json
          coverage: none

      - name: Sintassi PHP (php -l su tutti i file del plugin)
        run: |
          set -o pipefail
          fail=0
          while IFS= read -r file; do
            if ! output=$(php -l "$file" 2>&1); then
              echo "::error file=$file::errore di sintassi PHP"
              echo "$output"
              fail=1
            fi
          done < <(git ls-files '*.php')
          if [ "$fail" -ne 0 ]; then
            echo "Sintassi PHP non valida."
            exit 1
          fi
          echo "Sintassi PHP ok su $(git ls-files '*.php' | wc -l) file."

      - name: Sintassi JS (node --check sugli asset)
        run: |
          set -o pipefail
          node --version
          fail=0
          while IFS= read -r file; do
            if ! output=$(node --check "$file" 2>&1); then
              echo "::error file=$file::errore di sintassi JS"
              echo "$output"
              fail=1
            fi
          done < <(git ls-files '*.js')
          if [ "$fail" -ne 0 ]; then
            echo "Sintassi JS non valida."
            exit 1
          fi
          echo "Sintassi JS ok su $(git ls-files '*.js' | wc -l) file."

      - name: Harness di regressione (tests/)
        run: |
          php tests/guarded-get-test.php
          php tests/feed-pin-test.php
